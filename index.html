<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lucky Demo Casino</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07091a;--panel:#11152c;--panel2:#1a2042;--line:#262d58;--gold:#ffc83d;--green:#1fd17a;--red:#ff4d5e;--txt:#eef1ff;--mut:#8890b5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:Montserrat,-apple-system,sans-serif;min-height:100vh;user-select:none;-webkit-user-select:none;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
button:disabled{opacity:.4}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(7,9,26,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;flex-shrink:0}
.hbtn svg{width:19px;height:19px}
.hbtn.gold{background:linear-gradient(180deg,#ffe58a,#ff9a1f);border:none;color:#3a2000}
#backBtn{visibility:hidden}
.logo{flex:1;font-weight:900;font-size:15px;letter-spacing:.5px;white-space:nowrap}
.logo span{background:linear-gradient(90deg,#ffe58a,#ffb020,#ff6a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.balance{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);padding:7px 10px;border-radius:12px;font-weight:800;font-size:13px}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2,#ffc83d 45%,#b8860b);box-shadow:inset 0 0 0 2px #e0a800;display:inline-block}
.screen{display:none;padding:12px 10px 40px;max-width:540px;margin:0 auto}
.screen.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.hero{position:relative;border-radius:22px;overflow:hidden;padding:20px 18px;min-height:165px;background:radial-gradient(circle at 85% 40%,rgba(255,200,60,.35),transparent 45%),linear-gradient(120deg,#2a1470,#6a1fc2 55%,#d42f7e);box-shadow:0 10px 30px rgba(106,31,194,.35)}
.hero small{font-size:10px;font-weight:900;letter-spacing:2px;color:#ffd34d}
.hero h1{font-size:24px;font-weight:900;line-height:1.1;margin-top:4px;max-width:62%}
.hero p{font-size:12px;opacity:.85;margin-top:6px;max-width:58%}
.cta{margin-top:14px;padding:10px 24px;border:none;border-radius:12px;font-weight:900;font-size:14px;color:#3a2000!important;background:linear-gradient(180deg,#ffe58a,#ffb020);box-shadow:0 4px 0 #a86a00}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 #a86a00}
.hero-art{position:absolute;right:-2px;top:50%;transform:translateY(-50%) rotate(8deg);width:140px;height:140px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
.hero-art svg{width:100%;height:100%}
.tabs{display:flex;gap:6px;margin:14px 0}
.tab{flex:1;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--mut)!important;font-weight:800;font-size:12px}
.tab.on{background:linear-gradient(180deg,#8b6cff,#5b3df5);color:#fff!important;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:3/4;border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .15s;cursor:pointer}
.card:active{transform:scale(.97)}
.card .art{position:absolute;inset:0;display:grid;place-items:center}
.card .art canvas{width:100%;height:100%;display:block}
.trio{display:flex;align-items:center;justify-content:center;width:100%;margin-top:-22%}
.trio i{width:34%;display:block}.trio i.mid{width:50%;margin:0 -9%;position:relative;z-index:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.trio svg{width:100%;height:auto;display:block}
.card .info{position:absolute;left:0;right:0;bottom:0;padding:34px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.9))}
.card .info b{display:block;font-size:15px;font-weight:900}.card .info small{font-size:10px;color:#cfd3ea;font-weight:600}
.badge{position:absolute;top:8px;left:8px;z-index:2;font-size:9px;font-weight:900;padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.5);letter-spacing:.5px}
.badge.hot{background:linear-gradient(90deg,#ff3d3d,#ff8a1a)}.badge.new{background:linear-gradient(90deg,#1fd17a,#0f9a8a)}
.rtp{position:absolute;top:8px;right:8px;z-index:2;font-size:9px;font-weight:800;padding:3px 6px;border-radius:6px;background:rgba(0,0,0,.5)}
.bg-fruit{background:radial-gradient(circle at 50% 35%,#ff6a5c,#6a0c26 75%)}
.bg-gems{background:radial-gradient(circle at 50% 35%,#1fb08a,#06263d 75%)}
.bg-rocket{background:radial-gradient(circle at 30% 80%,#3b2a9b,#07081f 75%)}
.bg-pilot{background:radial-gradient(circle at 30% 80%,#8a1428,#14040b 75%)}
.bg-hop,.bg-tower{background:#1a1f33}
.bg-mahjong{background:radial-gradient(circle at 50% 35%,#2aa060,#062a16 75%)}
.bg-candy{background:radial-gradient(circle at 50% 35%,#ff8ad0,#4a0f5a 75%)}
.bg-ufo{background:radial-gradient(circle at 30% 80%,#0f6a5a,#020814 75%)}
.bg-plinko{background:radial-gradient(circle at 50% 20%,#5a2bd6,#0a0620 75%)}
.bg-mines{background:radial-gradient(circle at 50% 35%,#1f5a8a,#06101f 75%)}
.bg-roulette{background:radial-gradient(circle at 50% 40%,#0f7a3a,#03200f 75%)}
.bg-bj{background:radial-gradient(circle at 50% 40%,#127a4a,#032015 75%)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px;font-size:16px;font-weight:900}
.sec-h small{font-size:11px;color:var(--mut);font-weight:700}
.mart{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:68%;margin-top:-24%}
.mart i{aspect-ratio:1;border-radius:9px;background:linear-gradient(180deg,#2a3366,#1a2042);display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.mart i.g{background:radial-gradient(circle,#1f9a6a,#0a3a2a)}.mart i.b{background:radial-gradient(circle,#ff4d5e,#5a0010)}
.mart svg{width:78%;height:78%}
.bjart{display:flex;margin-top:-24%}.bjart .pc{transform:rotate(-10deg)}.bjart .pc+.pc{transform:rotate(8deg);margin-left:-22px}
.disc{color:var(--mut);font-size:11px;text-align:center;margin-top:22px;line-height:1.6}
/* SLOT */
.slot{border-radius:22px;padding:10px 8px 12px;position:relative;transition:background .6s}
.slot.fruit{background:radial-gradient(circle at 50% 0,#7a1530,#20040d 75%)}
.slot.gems{background:radial-gradient(circle at 50% 0,#0f4a5a,#050f1a 75%)}
.slot.mahjong{background:radial-gradient(circle at 50% 0,#1f7a4a,#03120a 75%)}
.slot.candy{background:radial-gradient(circle at 50% 0,#ff7ac8,#320840 75%)}
.slot.infs{background:radial-gradient(circle at 50% 0,#7a2bd6,#16052c 75%)!important}
.glogo{text-align:center;font-weight:900;font-size:26px;letter-spacing:1px;margin:2px 0;background:linear-gradient(180deg,#fff6c2,#ffc83d 50%,#c27a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #5a2a00) drop-shadow(0 0 12px rgba(255,180,0,.35))}
.ginfo{text-align:center;font-size:10px;font-weight:800;color:#ffffff99;letter-spacing:.8px;margin-bottom:8px}
.fsbar{display:none;justify-content:space-between;align-items:center;padding:8px 12px;margin-bottom:8px;border-radius:12px;background:linear-gradient(90deg,#ff3d8b,#7c5cff);font-weight:900;font-size:12px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{filter:brightness(1.25)}}
.frame{position:relative;padding:4px 5px;border-radius:16px;background:linear-gradient(180deg,#ffe58a,#c27a00 35%,#ffd34d 60%,#8a5200);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 30px rgba(255,190,40,.25)}
.mahjong .frame{background:linear-gradient(180deg,#ffe58a,#b8001a 30%,#ff3d4f 60%,#6a0010)}
.candy .frame{background:linear-gradient(180deg,#fff,#ff8ad0 35%,#ffd6f0 60%,#c23a9a)}
.bulbs{height:10px;margin:0 8px;background:radial-gradient(circle,#fffbe0 0 2px,#ffb020 3px,transparent 4px) 0 50%/16px 10px repeat-x;animation:blink .7s steps(2) infinite}
@keyframes blink{50%{background-position:8px 50%}}
.reels{position:relative;display:flex;gap:3px;padding:5px;margin:3px 0;border-radius:12px;background:#07080f}
.reel{position:relative;flex:1;overflow:hidden;border-radius:7px}
.fruit .reel{background:linear-gradient(180deg,#3a0a18,#5a1428 50%,#3a0a18)}
.gems .reel,.infs .reel{background:linear-gradient(180deg,#0a1824,#163246 50%,#0a1824)}
.mahjong .reel{background:linear-gradient(180deg,#073420,#0f5534 50%,#073420)}
.candy .reel{background:linear-gradient(180deg,#5a1f7a,#8a3fb0 50%,#5a1f7a)}
.reel::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 14%,transparent 86%,rgba(0,0,0,.5))}
.reel.antic{box-shadow:0 0 0 2px #ffd34d,0 0 24px #ffb020;animation:antg .35s infinite alternate}
@keyframes antg{to{box-shadow:0 0 0 2px #fff,0 0 34px #ff7a1a}}
.strip{will-change:transform}
.strip.blur{filter:blur(1.6px)}
.strip:not(.blur) .cell svg{filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}
.reel.bounce .strip{animation:bnc .26s ease-out}
@keyframes bnc{35%{transform:translateY(calc(var(--ch)*.1))}}
.cell{height:var(--ch,60px);display:grid;place-items:center;position:relative;transition:opacity .25s}
.cell svg{width:90%;height:90%;overflow:visible}
.reels.dim .cell{opacity:.25}
.reels.dim .cell.win{opacity:1}
.cell.win svg{animation:wp .8s ease-in-out infinite}
.cell.win::before{content:'';position:absolute;inset:2px;border-radius:9px;border:2px solid #ffd34d;box-shadow:0 0 14px #ffb020,inset 0 0 14px rgba(255,190,40,.5)}
@keyframes wp{50%{transform:scale(1.12)}}
.cell.gold::after{content:'';position:absolute;inset:5% 9%;border-radius:10px;box-shadow:0 0 0 2px #ffd34d,0 0 12px #ffb020,inset 0 0 10px rgba(255,200,60,.6);pointer-events:none}
.cell.pop svg{animation:popout .24s forwards}
@keyframes popout{to{transform:scale(1.45);opacity:0}}
.cell .bm{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:calc(var(--ch)*.3);font-weight:900;color:#fff;text-shadow:0 2px 0 #000,0 0 8px #ff3d8b;pointer-events:none}
.mlad{display:flex;justify-content:center;gap:6px;margin:10px 0 0}
.mlad span{min-width:48px;text-align:center;padding:5px 8px;border-radius:10px;font-weight:900;font-size:14px;background:rgba(0,0,0,.45);color:#ffffff80;border:1px solid rgba(255,255,255,.1);transition:.25s}
.mlad span.on{background:linear-gradient(180deg,#ffe58a,#ff9a1f);color:#3a1a00;transform:scale(1.12);box-shadow:0 0 16px rgba(255,170,0,.6)}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.lines polyline{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(0,0,0,.9))}
.msg{height:36px;display:flex;align-items:center;justify-content:center;gap:3px;font-weight:800;font-size:13px;color:#ffe58a;text-shadow:0 0 10px rgba(255,190,40,.5)}
.msg b{color:#fff}
.mi{display:inline-block;width:24px;height:24px}.mi svg{width:100%;height:100%}
.meters{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:6px}
.meter{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:6px 4px;text-align:center;min-width:0}
.meter small{display:block;font-size:9px;color:var(--mut);font-weight:800;letter-spacing:.8px;margin-bottom:2px}
.meter b{font-size:13px;font-weight:900;white-space:nowrap}
.meter.win b{color:var(--gold)}
.betm{display:flex;align-items:center;justify-content:space-between;gap:4px}
.betm button{width:26px;height:24px;border-radius:7px;border:none;background:var(--panel2);font-weight:900;font-size:16px;line-height:1}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:0 2px}
.cbtn{width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.45);font-weight:900;font-size:11px;display:grid;place-items:center}
.cbtn svg{width:22px;height:22px}
.cbtn.on{background:linear-gradient(180deg,#2be38a,#14a85f);border-color:transparent}
.spin{width:88px;height:88px;border-radius:50%;border:none;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#7dffb5,#14c46a 50%,#06703a);box-shadow:0 0 0 4px rgba(255,255,255,.15),0 8px 26px rgba(20,196,106,.5)}
.spin:active{transform:scale(.95)}
.spin svg{width:44px;height:44px}
.spin.go svg{animation:rot .6s linear infinite}
.spin.stop{background:radial-gradient(circle at 50% 30%,#ff9aa3,#e0283a 50%,#7a0010);box-shadow:0 0 0 4px rgba(255,255,255,.15),0 8px 26px rgba(224,40,58,.5)}
.cnt{position:absolute;bottom:-2px;right:-4px;background:#ffd34d;color:#3a2000;font-size:11px;font-weight:900;border-radius:10px;padding:2px 7px}
@keyframes rot{to{transform:rotate(360deg)}}
/* MODAL */
.modal{position:fixed;inset:0;z-index:70;background:rgba(3,4,12,.82);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.mbox{width:100%;max-width:420px;max-height:86vh;overflow:auto;background:linear-gradient(180deg,#1a2042,#0e1230);border:1px solid var(--line);border-radius:20px;padding:18px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.mbody h3{font-size:18px;font-weight:900;margin-bottom:8px;text-align:center}
.mbody h4{font-size:14px;margin:16px 0 8px;text-align:center}
.mbtn{width:100%;margin-top:14px;padding:13px;border:none;border-radius:14px;font-weight:900;font-size:15px;background:linear-gradient(180deg,#8b6cff,#5b3df5)}
.mnote{font-size:12px;color:var(--mut);line-height:1.5;margin:8px 0;text-align:center}
.pt{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pts{width:58px;height:58px;border-radius:10px;background:#0a0d22;padding:4px}
.pts svg{width:100%;height:100%}
.pt .v{font-size:13px;line-height:1.6;color:#cfd3ea}.pt .v b{color:var(--gold)}
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ld{text-align:center}.ldg{display:grid;gap:2px;background:#0a0d22;padding:3px;border-radius:5px}
.ldg i{aspect-ratio:1;background:#262d58;border-radius:2px}.ldg i.on{background:var(--gold)}
.ld span{font-size:10px;color:var(--mut);font-weight:800}
.fsm{text-align:center;padding:8px 0}.fsm-t{font-size:19px;font-weight:900;color:#ffe58a}
.fsm-n{font-size:80px;font-weight:900;line-height:1.05;margin:8px 0;background:linear-gradient(180deg,#fff,#ffd34d 50%,#ff8a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6a2a00)}
.fsm-s{font-weight:900;letter-spacing:1px}.fsm-x{margin-top:8px;color:var(--mut);font-weight:700;font-size:13px}
.apg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.apg button{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:900;font-size:16px}
.fr{margin-bottom:10px}.fr small{display:block;font-size:11px;color:var(--mut);font-weight:700;margin-bottom:3px}
.fr code{display:block;font-size:11px;word-break:break-all;background:#0a0d22;padding:8px;border-radius:8px;color:#9fe8c0;user-select:text;-webkit-user-select:text}
.fr b{font-size:16px}
/* BIG WIN */
#bw{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,rgba(70,25,0,.75),rgba(0,0,0,.92));overflow:hidden}
#bw.show{display:flex}
#bw canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#bw .rays{position:absolute;width:760px;height:760px;border-radius:50%;background:repeating-conic-gradient(rgba(255,200,60,.14) 0 10deg,transparent 10deg 20deg);animation:rot 14s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 15%,transparent 65%);mask-image:radial-gradient(circle,#000 15%,transparent 65%)}
#bw .t{position:relative;font-size:50px;font-weight:900;font-style:italic;text-align:center;background:linear-gradient(180deg,#fff,#ffe58a 30%,#ffb020 60%,#c25a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #5a2000) drop-shadow(0 0 20px rgba(255,170,0,.8));animation:bwp .6s ease-in-out infinite alternate}
#bw .a{position:relative;font-size:38px;font-weight:900;margin-top:10px;text-shadow:0 0 20px rgba(255,200,60,.9)}
#bw .skip{position:relative;margin-top:26px;font-size:11px;color:#ffffff88;font-weight:700}
@keyframes bwp{to{transform:scale(1.08)}}
/* CRASH + MINI */
.hist{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
.hist::-webkit-scrollbar{display:none}
.hc{flex-shrink:0;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:800;border:none;background:rgba(52,180,255,.12);color:#5ec8ff!important}
.hc.m{background:rgba(145,62,248,.16);color:#b77bff!important}.hc.h{background:rgba(255,200,61,.16);color:var(--gold)!important}
.stage{position:relative;height:270px;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.stage.sg{height:300px;margin-top:8px}
.rocket .stage{background:#04051a}.plane .stage{background:#1a0b3d}.ufo .stage{background:#020812}
.hop .stage{background:#2b2f3c}.tower .stage{background:#5ec8ff}
.stage canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding-bottom:20px}
.mult{font-size:58px;font-weight:900;letter-spacing:-1px;text-shadow:0 0 30px rgba(255,255,255,.35);transition:color .3s}
.mult.crashed{color:var(--red)!important;text-shadow:0 0 30px rgba(255,77,94,.7)!important}
.sub{font-size:12px;font-weight:900;color:var(--mut);letter-spacing:1.5px;margin-top:2px}
.mult.crashed+.sub{color:var(--red)}
.prog{display:none}
.fair{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:4px;font-size:9px;font-weight:900;padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.5);color:#5ee6a0!important;border:1px solid rgba(94,230,160,.3)}
.fair svg{width:12px;height:12px}
.float{position:absolute;left:0;right:0;top:58%;text-align:center;font-weight:900;font-size:22px;color:var(--green);animation:flt 1.4s ease-out forwards;pointer-events:none;text-shadow:0 0 12px rgba(31,209,122,.8),0 2px 0 #000}
@keyframes flt{to{transform:translateY(-70px);opacity:0}}
.hud{position:absolute;top:10px;left:10px;pointer-events:none;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:6px 12px;backdrop-filter:blur(4px)}
.hm{font-size:24px;font-weight:900}.hm.lost{color:var(--red)}
.hs{font-size:10px;font-weight:800;color:#cfd3ea;letter-spacing:.5px}
.ladder{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.ladder::-webkit-scrollbar{display:none}
.lc{flex-shrink:0;padding:5px 9px;border-radius:8px;font-size:11px;font-weight:800;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.lc.done{background:rgba(255,200,61,.18);color:var(--gold);border-color:rgba(255,200,61,.4)}
.lc.next{background:linear-gradient(180deg,#8b6cff,#5b3df5);color:#fff;border-color:transparent}
.diff{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:#0a0d22;padding:4px;border-radius:12px;margin-bottom:10px}
.diff button{padding:8px 0;border:none;border-radius:9px;background:transparent;font-weight:800;font-size:12px;color:var(--mut)!important}
.diff button.on{background:var(--panel2);color:#fff!important;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.panels{display:grid;gap:10px;margin-top:12px}

  if(ufo){const tw=this.city.length*34;this.city.forEach(b=>{const x=((b.x-this.off*.4)%tw+tw)%tw-34;c.fillStyle='#0a1622';c.fillRect(x,H-b.h,b.w,b.h);b.lit.forEach((l,i)=>{if(!l)return;c.fillStyle='rgba(255,220,120,.7)';c.fillRect(x+4+(i%3)*7,H-b.h+6+Math.floor(i/3)*10,3,4)})})}}

class StepGame{
 constructor(root,cfg){this.root=root;this.cfg=cfg;this.di=1;this.active=false;this.anim=false;this.bet=0;this.started=false;this.render()}
 get D(){return this.cfg.diffs[this.di]}
 mult(k){return k<=0?1:Math.floor(100*STEP_RTP/Math.pow(this.D.p,k))/100}
 render(){const c=this.cfg;
  this.root.innerHTML=`<div class="mini ${c.type}"><div class="glogo">${c.title}</div><div class="ginfo">RTP 97% · ${c.info}</div>
   <div class="stage sg"><canvas></canvas><div class="hud"><div class="hm">1.00x</div><div class="hs"></div></div></div>
   <div class="ladder"></div>
   <div class="panel"><div class="diff">${c.diffs.map((d,i)=>`<button data-i="${i}">${d.n}</button>`).join('')}</div>
    <div class="prow"><div class="pl">${AMT_HTML}</div><div class="pbs"><button class="pbtn green go"></button><button class="pbtn orange co"></button></div></div></div></div>`;
  const r=this.root;this.cv=$('canvas',r);this.ctx=this.cv.getContext('2d');this.hm=$('.hm',r);this.hs=$('.hs',r);this.lad=$('.ladder',r);this.goB=$('.go',r);this.coB=$('.co',r);this.stage=$('.stage',r);
  this.inp=bindAmt(r,()=>this.upd());
  $$('.diff button',r).forEach(b=>b.onclick=()=>{if(this.active||this.anim)return;this.di=+b.dataset.i;Snd.click();this.reset();this.upd()});
  this.goB.onclick=()=>{Snd.a();hap('medium');this.active?this.step():this.start()};
  this.coB.onclick=()=>{Snd.a();hap('medium');this.cashout()};
  this.reset();this.upd()}
 reset(){this.pos=0;this.lost=false;this.msg='';this.onReset()}
 upd(){const r=this.root,a=readAmtOf(this.inp,true);
  $$('.diff button',r).forEach((b,i)=>{b.classList.toggle('on',i===this.di);b.disabled=this.active||this.anim});
  $$('.amt button,.ain,.chips button',r).forEach(e=>e.disabled=this.active||this.anim);
  if(!this.active){this.goB.className='pbtn green go';this.goB.innerHTML=`<b>ИГРАТЬ</b><small>${fmt(a)}</small>`;this.coB.style.display='none'}
  else{this.goB.className='pbtn blue go';this.goB.innerHTML=`<b>${this.cfg.stepLabel}</b><small>далее ×${this.mult(this.pos+1).toFixed(2)}</small>`;
   this.coB.style.display='';this.coB.disabled=this.anim||this.pos===0;this.coB.innerHTML=`<b>ЗАБРАТЬ</b><small>${fmt(this.bet*this.mult(this.pos))}</small>`}
  this.goB.disabled=this.anim;
  this.hm.classList.toggle('lost',this.lost);this.hm.textContent=this.lost?this.cfg.loseText:this.mult(this.pos).toFixed(2)+'x';
  this.hs.textContent=this.active?`ШАГ ${this.pos} / ${this.D.steps}`:this.msg||`ШАНС УСПЕХА ${Math.round(this.D.p*100)}%`;
  let h='';for(let k=1;k<=this.D.steps;k++)h+=`<span class="lc ${k<=this.pos&&!(this.lost&&k===this.pos)?'done':''} ${this.active&&k===this.pos+1?'next':''}">${this.mult(k).toFixed(2)}x</span>`;
  this.lad.innerHTML=h;const el=this.lad.children[Math.max(0,this.pos-1)];if(el)this.lad.scrollTo({left:el.offsetLeft-20,behavior:'smooth'})}
 start(){if(this.anim)return;const a=readAmtOf(this.inp);if(!a)return;if(!Wallet.take(a)){toast('Недостаточно монет');return}
  this.reset();this.bet=a;this.active=true;Snd.bet();this.upd()}
 step(){if(!this.active||this.anim)return;const ok=rnd()<this.D.p;this.pos++;this.anim=true;this.upd();this.animStep(ok)}
 stepDone(ok){this.anim=false;
  if(!ok){this.active=false;this.lost=true;this.msg='СТАВКА СГОРЕЛА';note('error');this.upd();return}
  Snd.t(620+this.pos*25,.12,'triangle',.1);
  if(this.pos>=this.D.steps){this.cashout();return}
  this.upd()}
 cashout(){if(!this.active||this.anim||this.pos===0)return;const m=this.mult(this.pos),w=this.bet*m;Wallet.add(w);this.active=false;Snd.cash();note('success');
  this.msg=`ВЫИГРЫШ ${fmt(w)}`;const f=document.createElement('div');f.className='float';f.textContent='+'+fmt(w);this.stage.appendChild(f);setTimeout(()=>f.remove(),1400);
  this.cel=Date.now();if(m>=15)bigWin(w,this.bet);this.upd()}
 onShow(){this.resize();if(!this.started){this.started=true;this.loop()}}
 resize(){const r=this.cv.getBoundingClientRect(),d=devicePixelRatio||1;this.cv.width=r.width*d;this.cv.height=r.height*d;this.ctx.setTransform(d,0,0,d,0,0);this.W=r.width;this.H=r.height}
 loop(){this.draw(Date.now());requestAnimationFrame(()=>this.loop())}
}
class HopRoad extends StepGame{

 onReset(){this.cars=[];this.blane=0;this.hop=null;this.dead=false;this.spawn={};this.deathLane=0;this.cam=this.cam||0}

  if(ok)this.cars=this.cars.filter(o=>!(o.k===k&&o.y>cy-170&&o.y<cy+110));else{this.deathLane=k;this.cars=this.cars.filter(o=>o.k!==k)}
  this.hop={from,t0:Date.now(),d:320,ok}}
 walk(c,x,w,fin){const H=this.H;c.fillStyle='#596075';c.fillRect(x,0,w,H);c.strokeStyle='rgba(0,0,0,.22)';c.lineWidth=1;
  for(let y=0;y<H;y+=30){c.beginPath();c.moveTo(x,y);c.lineTo(x+w,y);c.stroke()}

  if(fin){for(let i=0;i<Math.ceil(H/12);i++)for(let j=0;j<2;j++){c.fillStyle=(i+j)%2?'#fff':'#15182a';c.fillRect(x+16+j*12,i*12,12,12)}

  if(!this.fall&&!this.tip&&!this.debris.length){c.strokeStyle='#1a1d2c';c.lineWidth=2;c.beginPath();c.moveTo(tx,29);c.lineTo(tx,hangY-4);c.stroke();c.fillStyle='#ffc83d';rr(c,tx-7,hangY-7,14,7,2);c.fill();drawFloor(c,tx-BW/2,hangY,BW,BH,FLOOR_COL[n%FLOOR_COL.length],n)}
  if(this.pending){const P=this.pending,d=Math.abs(tx-topX);
   if((P.ok&&d<BW*.07)||(!P.ok&&d>BW*.62)){this.fall={x:tx,y:hangY+this.camY,vy:0,ok:P.ok,f:P.f,col:FLOOR_COL[n%FLOOR_COL.length]};this.pending=null;Snd.t(400,.15,'sine',.06,0,200)}}}
}

/* ---------- PLINKO с несколькими шарами ---------- */
function plinkoTable2(n,risk){const b=1+[4.8,10.4,18.4][risk]/n,P=[],raw=[];for(let i=0;i<=n;i++){P.push(binom(n,i)/2**n);raw.push(Math.pow(b,Math.abs(i-n/2)))}
 const k=.97/raw.reduce((s,v,i)=>s+v*P[i],0),rd=v=>v<10?Math.max(.1,Math.round(v*10)/10):v<100?Math.round(v):Math.round(v/5)*5;
 const m=raw.map(v=>rd(v*k));return{m,rtp:m.reduce((s,v,i)=>s+v*P[i],0)}}
class PlinkoX extends Plinko{
 render(){this.cnt=this.cnt||1;this.q=this.q||[];this.tab=plinkoTable2(this.n,this.risk);
  this.root.innerHTML=`<div class="plk"><div class="glogo">PLINKO</div><div class="ginfo"></div>
   <div class="stage"><canvas></canvas><div class="phist"></div></div>
   <div class="panel"><div class="lbl2">Риск</div><div class="diff dr">${['Низкий','Средний','Высокий'].map((t,i)=>`<button data-i="${i}">${t}</button>`).join('')}</div>
    <div class="lbl2">Ряды</div><div class="diff dn">${[8,10,12,14,16].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>
    <div class="lbl2">Шаров за бросок</div><div class="diff db">${[1,5,10,20,50].map(v=>`<button data-b="${v}">${v}</button>`).join('')}</div>
    <div class="prow"><div class="pl">${AMT_HTML}</div><div class="pbs"><button class="pbtn green go"></button><button class="pbtn blue au"></button></div></div></div></div>`;
  const r=this.root;this.cv=$('canvas',r);this.ctx=this.cv.getContext('2d');this.W=0;this.inp=bindAmt(r,()=>this.upd());
  const busy=()=>this.balls.length||this.q.length;
  $$('.dr button',r).forEach(b=>b.onclick=()=>{if(busy())return;this.risk=+b.dataset.i;this.tab=plinkoTable2(this.n,this.risk);Snd.click();this.upd()});
  $$('.dn button',r).forEach(b=>b.onclick=()=>{if(busy())return;this.n=+b.dataset.n;this.tab=plinkoTable2(this.n,this.risk);Snd.click();this.upd()});
  $$('.db button',r).forEach(b=>b.onclick=()=>{this.cnt=+b.dataset.b;Snd.click();this.upd()});
  $('.go',r).onclick=()=>{Snd.a();hap('light');this.drop()};
  $('.au',r).onclick=()=>{Snd.a();hap('medium');this.auto=!this.auto;this.nextAuto=0;this.upd()};this.upd()}
 upd(){const r=this.root,busy=this.balls.length+this.q.length>0,a=readAmtOf(this.inp,true);
  $$('.dr button',r).forEach((b,i)=>{b.classList.toggle('on',i===this.risk);b.disabled=busy});
  $$('.dn button',r).forEach(b=>{b.classList.toggle('on',+b.dataset.n===this.n);b.disabled=busy});
  $$('.db button',r).forEach(b=>b.classList.toggle('on',+b.dataset.b===this.cnt));
  $('.ginfo',r).textContent=`${this.n} РЯДОВ · RTP ${(this.tab.rtp*100).toFixed(1)}% · МАКС ×${fmtM(Math.max(...this.tab.m))}`;
  $('.go',r).innerHTML=`<b>БРОСИТЬ${this.cnt>1?' ×'+this.cnt:''}</b><small>${fmt(a*this.cnt)}</small>`;
  const au=$('.au',r);au.className='pbtn '+(this.auto?'red':'blue')+' au';au.innerHTML=this.auto?'<b>СТОП</b><small>автоигра</small>':'<b>АВТО</b><small>без остановки</small>';
  $('.phist',r).innerHTML=this.hist.slice(0,8).map(m=>`<span style="background:${m>=1?'#ffd34d':'#ff8a9a'}">${fmtM(m)}x</span>`).join('')}
 drop(){const a=readAmtOf(this.inp);if(!a)return false;const N=this.cnt;
  if(Wallet.get()+1e-9<a*N){toast('Недостаточно монет');this.auto=false;this.upd();return false}
  Wallet.take(a*N);const t=Date.now();for(let i=0;i<N;i++)this.q.push({path:Array.from({length:this.n},()=>rnd()<.5?0:1),t0:t+i*110,bet:a,n:this.n,tab:this.tab,li:-1});
  Snd.click();this.upd();return true}
 loop(){const now=Date.now();
  if(!this.root.offsetParent&&this.auto){this.auto=false;this.upd()}
  while(this.q.length&&this.q[0].t0<=now)this.balls.push(this.q.shift());
  if(this.auto&&!this.q.length&&now>=(this.nextAuto||0)){if(this.drop())this.nextAuto=now+this.cnt*110+450}
  this.draw(now);requestAnimationFrame(()=>this.loop())}
}

 const p=GAMES.find(g=>g.id==='plinko');p.make=r=>new PlinkoX(r);p.sub='8–16 рядов · до 50 шаров';p.badge='hot';renderLobby()})();
